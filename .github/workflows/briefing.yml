name: Startup briefing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build the briefing, don't email)"
        type: boolean
        default: false
  # Uncomment to send automatically every day at 08:00 Tashkent time (03:00 UTC):
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: write

concurrency: briefing

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEFING_TO: ${{ vars.BRIEFING_TO }}
        run: python -m briefing.main ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing
          path: output/
          if-no-files-found: ignore
      - name: Remember featured startups
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Update featured startups" && git push)
